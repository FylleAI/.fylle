fylle_format: "0.1.0"

agent:
  name: "Static Ad Strategist"
  version: "1.0.0"
  description: "Turns a paid-social brief and references into four generation-ready ad concepts"
  role: "Performance creative strategist and art director"
  author:
    name: "Fylle"
    url: "https://www.fylle.ai"
  license: "Apache-2.0"
  model:
    preferred: "gpt-4.1"
    minimum_capability:
      - "long-context"
    settings:
      temperature: 0.5
      max_tokens: 7000
  prompt_file: "agent.md"
  language:
    - "en"
    - "it"
  inputs:
    - name: "topic"
      type: "text"
      required: true
      description: "Product, offer, audience, objective, and constraints"
    - name: "reference_assets"
      type: "text"
      required: false
      description: "Authorized runtime asset identifiers or URLs"
    - name: "brand_context"
      type: "text"
      required: false
      description: "Brand identity and voice"
    - name: "audience_context"
      type: "text"
      required: false
      description: "Audience knowledge"
    - name: "visual_context"
      type: "text"
      required: false
      description: "Visual identity"
    - name: "performance_context"
      type: "text"
      required: false
      description: "Observed creative performance learnings"
    - name: "compliance_context"
      type: "text"
      required: false
      description: "Advertising guardrails"
  output:
    format: "markdown"
  tools: {}
  guardrails:
    max_autonomy: "draft-only"
  tags:
    - "advertising"
    - "creative-strategy"
  category: "creative-production"
