fylle_format: "0.1.0"

agent:
  name: "Social Visual Producer"
  version: "1.0.0"
  description: "Generates square and vertical social visuals and assembles the final deliverable"
  role: "Social image production operator"
  author:
    name: "Fylle"
    url: "https://www.fylle.ai"
  license: "Apache-2.0"
  model:
    preferred: "gpt-4.1"
    minimum_capability:
      - "tool-use"
    settings:
      temperature: 0.4
      max_tokens: 4000
  prompt_file: "agent.md"
  language:
    - "en"
    - "it"
  inputs:
    - name: "copy_and_briefs"
      type: "text"
      required: true
      description: "Feed/story copy and visual briefs"
    - name: "brand_context"
      type: "text"
      required: false
      description: "Brand identity"
    - name: "visual_context"
      type: "text"
      required: false
      description: "Visual identity and authorized assets"
    - name: "compliance_context"
      type: "text"
      required: false
      description: "Guardrails"
  output:
    format: "markdown"
  tools:
    required:
      - name: "image_generation"
        protocol: "function"
        description: "Generate square and vertical social visuals"
  guardrails:
    max_autonomy: "draft-only"
  tags:
    - "social"
    - "image-generation"
  category: "content-production"
