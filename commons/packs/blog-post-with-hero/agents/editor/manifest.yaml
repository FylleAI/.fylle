fylle_format: "0.1.0"

agent:
  name: "Blog Editor"
  version: "1.0.0"
  description: "Turns a researched draft into a polished article and visual direction brief"
  role: "Senior blog editor"
  author:
    name: "Fylle"
    url: "https://www.fylle.ai"
  license: "Apache-2.0"
  model:
    preferred: "claude-sonnet-4-5"
    minimum_capability:
      - "long-context"
    settings:
      temperature: 0.3
      max_tokens: 8000
  prompt_file: "agent.md"
  language:
    - "en"
    - "it"
  inputs:
    - name: "draft"
      type: "text"
      required: true
      description: "Researcher's complete draft with sources"
    - name: "brand_context"
      type: "text"
      required: false
      description: "Runtime-provided brand voice and identity"
    - name: "audience_context"
      type: "text"
      required: false
      description: "Runtime-provided audience knowledge"
    - name: "compliance_context"
      type: "text"
      required: false
      description: "Runtime-provided guardrails"
  output:
    format: "markdown"
  tools: {}
  guardrails:
    max_autonomy: "draft-only"
  tags:
    - "blog"
    - "editing"
  category: "content-production"
