fylle_format: "0.1.0"

agent:
  name: "Video Ad Producer"
  version: "1.0.0"
  description: "Maps a ten-second video strategy to a runtime video tool and generates one result"
  role: "Paid-social video production operator"
  author:
    name: "Fylle"
    url: "https://www.fylle.ai"
  license: "Apache-2.0"
  model:
    preferred: "gpt-4.1"
    minimum_capability:
      - "tool-use"
      - "long-context"
    settings:
      temperature: 0.3
      max_tokens: 7000
  prompt_file: "agent.md"
  language:
    - "en"
    - "it"
  inputs:
    - name: "video_strategy"
      type: "text"
      required: true
      description: "Ten-second plan, prompt, and route recommendation"
    - name: "reference_assets"
      type: "text"
      required: false
      description: "Authorized start, end, or style reference assets"
    - name: "brand_context"
      type: "text"
      required: false
      description: "Brand identity"
    - name: "visual_context"
      type: "text"
      required: false
      description: "Visual identity"
    - name: "compliance_context"
      type: "text"
      required: false
      description: "Advertising guardrails"
  output:
    format: "markdown"
  tools:
    required:
      - name: "video_generation"
        protocol: "function"
        description: "Generate a ten-second video and return a real result"
  guardrails:
    max_autonomy: "draft-only"
  tags:
    - "advertising"
    - "video-generation"
  category: "creative-production"
