fylle_format: "0.1.0"

agent:
  name: "Blog Visual Producer"
  version: "1.0.0"
  description: "Generates a contextual hero image and returns the final article deliverable"
  role: "Editorial visual producer"
  author:
    name: "Fylle"
    url: "https://www.fylle.ai"
  license: "Apache-2.0"
  model:
    preferred: "gpt-4.1"
    minimum_capability:
      - "tool-use"
      - "long-context"
    settings:
      temperature: 0.4
      max_tokens: 8000
  prompt_file: "agent.md"
  language:
    - "en"
    - "it"
  inputs:
    - name: "edited_article"
      type: "text"
      required: true
      description: "Edited article followed by its internal image direction brief"
    - name: "brand_context"
      type: "text"
      required: false
      description: "Runtime-provided brand identity"
    - name: "visual_context"
      type: "text"
      required: false
      description: "Runtime-provided visual identity and authorized assets"
    - name: "compliance_context"
      type: "text"
      required: false
      description: "Runtime-provided guardrails"
  output:
    format: "markdown"
  tools:
    required:
      - name: "image_generation"
        protocol: "function"
        description: "Generate one editorial hero image and return an image result"
  guardrails:
    max_autonomy: "draft-only"
  tags:
    - "blog"
    - "image-generation"
  category: "content-production"
