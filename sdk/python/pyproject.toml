[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fylle"
version = "0.1.0"
description = "Move AI agents between frameworks without rewriting them. Parse, validate, bridge, and run .fylle packages."
readme = "../../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Fylle", email = "davide@fylle.ai" },
]
keywords = ["ai", "agents", "format", "portable", "fylle", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/FylleAI/.fylle"
Documentation = "https://github.com/FylleAI/.fylle/tree/main/spec"
Repository = "https://github.com/FylleAI/.fylle"
Issues = "https://github.com/FylleAI/.fylle/issues"

[tool.hatch.build.targets.wheel]
packages = ["fylle", "fylle_bridge", "fylle_cli"]

[project.scripts]
fylle = "fylle_cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
bridge = [
    "anthropic>=0.20",
    "openai>=1.10",
]
